name: Build and Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure output directory exists
        run: mkdir -p dist

      # Each run starts from a clean checkout with no history - muf.py
      # merges fresh fetches into whatever load_store() finds on disk, so
      # without this, a single failed/rate-limited station fetch would
      # wipe that station's chart instead of just skipping new points.
      # key always misses (run_id is unique) so restore always falls back
      # to the most recent muf-data- entry; a fresh cache is saved after
      # this run's dist/muf_data.json is written, for the next run to find.
      - name: Restore station history cache
        uses: actions/cache@v4
        with:
          path: dist/muf_data.json
          key: muf-data-${{ github.run_id }}
          restore-keys: |
            muf-data-

      - name: Run muf.py
        env:
          MUF_OUTPUT_DIR: dist
        run: python3 muf.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=muf-muncher
