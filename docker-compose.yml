services:
  muf-dashboard:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Maidenhead grid square - picks the two nearest of the ten curated
      # GIRO stations as hero tiles. Defaults to Frankfurt am Main if unset.
      # ${VAR:-} (not a literal empty value) so it actually picks up a host
      # env var, a .env file, or a stack manager's (Portainer, Dockge, ...)
      # environment panel - the :- default keeps it silently empty (rather
      # than a Compose "variable not set" warning) when nobody sets it.
      - MUF_HOME_LOCATOR=${MUF_HOME_LOCATOR:-}
    volumes:
      - muf-data:/data
    restart: unless-stopped

volumes:
  muf-data:
